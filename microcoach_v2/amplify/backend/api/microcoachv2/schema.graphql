enum UserRole {
  ADMIN
  TEACHER
}

type MicroCoachUser
  @model
  @auth(
    rules: [
      # each teacher owns (creates/reads/updates/deletes) their own record,
      # keyed by their Cognito sub stored in `cognitoId`
      { allow: owner, ownerField: "cognitoId", operations: [create, read, update, delete] }
      # members of the Cognito "Admins" group can read/list all users
      { allow: groups, groups: ["Admins"], operations: [read] }
    ]
  ) {
  id: ID!
  cognitoId: String! @index(name: "byCognitoId", queryField: "microCoachUsersByCognitoId")
  email: String! @index(name: "byEmail", queryField: "microCoachUsersByEmail")
  teacherName: String
  classes: [String]
  role: UserRole! @index(name: "byRole", queryField: "microCoachUsersByRole")
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}
