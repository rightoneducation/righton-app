enum UserRole {
  ADMIN
  MEMBER
}

type MicroCoachUser
  @model
  @auth(
    rules: [
      # each teacher owns (creates/reads/updates/deletes) their own record,
      # keyed by their Cognito sub stored in `cognitoId`
      {
        allow: owner
        ownerField: "cognitoId"
        operations: [create, read, update, delete]
      }
      # members of the Cognito "Admins" group can read/list all users
      { allow: groups, groups: ["Admins"], operations: [read] }
    ]
  ) {
  id: ID!
  cognitoId: String! @index(name: "byCognitoId", queryField: "usersByCognitoId")
  email: String! @index(name: "byEmail", queryField: "usersByEmail")
  firstName: String
  lastName: String
  classes: [MicroCoachClassroom] @hasMany(indexName: "byUser", fields: ["id"])
  role: UserRole! @index(name: "byRole", queryField: "usersByRole")
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type MicroCoachClassroom @model @auth(rules: [{ allow: private }]) {
  id: ID!
  userId: ID! @index(name: "byUser")

  sessions: [MicroCoachSession] @hasMany(indexName: "byClass", fields: ["id"])
  students: [MicroCoachStudent] @hasMany(indexName: "byClass", fields: ["id"])

  name: String!
  grade: Int
  state: String
  schoolYear: String
}

# Extend later when student data becomes part of the workflow.
type MicroCoachStudent @model @auth(rules: [{ allow: private }]) {
  id: ID!
  classId: ID! @index(name: "byClass")
  name: String!
  externalId: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

enum SessionStatus {
  DATA_INGESTED
  GENERATED
  COMPLETED
}

enum PublishStatus {
  DRAFT
  PUBLISHED
}

type MicroCoachSession @model @auth(rules: [{ allow: private }]) {
  id: ID!
  classId: ID! @index(name: "byClass")
  sessionLabel: String
  weekLabel: String
  weekNumber: Int
  topic: String
  ccssStandards: [String]
  status: SessionStatus # DATA_INGESTED | GENERATED | COMPLETED
  publishStatus: PublishStatus # "DRAFT" | "PUBLISHED"
  studentWorksAnalyzed: Int
  studentsWithStrongUnderstanding: Int
  studentsWithStrongUnderstandingIds: [ID]
  studentIdsNeedingSupport: [ID]

  ppqAssessmentId: ID
  postPpqAssessmentId: ID
  assessments: [MicroCoachAssessment]
    @hasMany(indexName: "bySession", fields: ["id"])
  misconceptions: [MicroCoachMisconception]
    @hasMany(indexName: "bySession", fields: ["id"])
  pregeneratedNextSteps: AWSJSON
  evaluationResults: AWSJSON

  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

enum AssessmentType {
  PPQ
  POST_PPQ
}

# Extend later when pipeline work is ready to hook.
type MicroCoachAssessment @model @auth(rules: [{ allow: private }]) {
  id: ID!
  classId: ID! @index(name: "byClass")
  sessionId: ID! @index(name: "bySession")
  assessmentCode: String!
  type: AssessmentType!
  weekNumber: Int!
}

enum Badge {
  RECOMMENDED_FOCUS
  CORE
}

enum PrevalenceLevel {
  FEW
  SOME
  MOST
}

enum DetailStatus {
  COMPLETE
  PARTIAL
  CARD_ONLY
  NOT_IN_WIREFRAMES
}

type MicroCoachMisconception @model @auth(rules: [{ allow: private }]) {
  id: ID!
  sessionId: ID! @index(name: "bySession")
  classId: ID! @index(name: "byClass")
  activities: [MicroCoachActivity]
    @hasMany(indexName: "byMisconception", fields: ["id"])

  rank: Int!
  badge: Badge
  title: String!
  titleCased: String
  shortLabel: String
  description: String!
  consequence: String

  prevalence: Prevalence
  detailStatus: DetailStatus!

  studentWork: AWSJSON
  skillContext: AWSJSON

  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Prevalence {
  level: PrevalenceLevel!
  label: String!
  studentsNeedingSupport: Int
  studentsUnderstood: Int
  studentsNoResponse: Int
  totalAnalyzed: Int!
  supportSummaryLabel: String
  understoodSummaryLabel: String
  shortCountLabel: String
}

# Activity types are expected to evolve as design changes.
enum ActivityType {
  INCORRECT_WORKED_EXAMPLES
  COMPARE_THE_THINKING
  MATH_HOSPITAL
  MULTIPLE_REPRESENTATIONS
  FAVORITE_NO
}

enum GroupingLevel {
  WHOLE_CLASS
  SPLIT_CLASS
  SMALL_GROUP
}

enum WorkStatus {
  CORRECT
  INCORRECT
  NEUTRAL
}

enum ViewMode {
  TEACHER
  STUDENT
}

type MicroCoachActivity @model @auth(rules: [{ allow: private }]) {
  id: ID!
  misconceptionId: ID! @index(name: "byMisconception")
  sessionId: ID! @index(name: "bySession")
  classId: ID! @index(name: "byClass")

  activityType: ActivityType!
  title: String
  isSelected: Boolean
  selectLabel: String
  detailStatus: DetailStatus!

  routine: AWSJSON
  durationMinutes: Int
  durationLabel: String
  grouping: Grouping
  targets: String
  instructionalMove: String
  strategyTag: String
  phases: AWSJSON

  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Grouping {
  level: GroupingLevel!
  label: String!
}

enum PlanStatus {
  SAVED
  COMPLETED
}

type MicroCoachSavedPlan @model @auth(rules: [{ allow: private }]) {
  id: ID!
  classId: ID! @index(name: "byClass")
  sessionId: ID @index(name: "bySession")
  items: [Item]
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Item {
  id: ID!
  status: PlanStatus!
}

enum ContextDataType {
  NEXT_STEP_LESSON
  EXEMPLAR
  STRATEGY
  WALKTHROUGH
  STUDENT_WORK_SAMPLE
  LESSON_PLAN
}

# Shared knowledge library for the coaching pipeline — reference lessons,
# strategies, exemplars. Not classroom data: no FK to Class/Session/Student.
# Carries an apiKey rule because the seed/eval CLI reads it over the API key;
# no other model in this schema should.
type ContextData
  @model
  @auth(rules: [{ allow: private }, { allow: public, provider: apiKey }]) {
  id: ID!
  type: ContextDataType!
  title: String!
  gradeLevel: Int
  weekNumber: Int
  ccssStandards: [String]
  assessmentCode: String
  isReference: Boolean # true for References/ folder docs (shared across classrooms)
  nextStepLesson: NextStepLesson
  exemplarQuestions: [ExemplarQuestion]
  strategy: InstructionalStrategy
  walkthroughData: WalkthroughData
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type ExemplarQuestion {
  questionNumber: Int!
  questionText: String!
  ccssStandard: String!
  correctAnswer: String!
  pointValue: Int!
  answerChoices: [AnswerChoice]
  misconceptions: [ExemplarMisconception]
  sourceNote: String
}

type AnswerChoice {
  label: String!
  text: String!
}

type ExemplarMisconception {
  description: String!
  targetAnswer: String
}

type NextStepLesson {
  targetAssessmentCode: String!
  targetQuestionNumbers: [Int]
  topic: String!
  targetProblem: String!
  errorScenarios: [ErrorScenario]
  phases: [LessonPhase]
  keyTakeaways: [String]
  independentProblems: [String]
  exitTicket: String
}

type ErrorScenario {
  studentLabel: String!
  isCorrect: Boolean!
  approach: String!
  reasoning: [String]
}

type LessonPhase {
  phaseName: String!
  durationMinutes: Int
  steps: [String]
  teacherPrompts: [String]
}

type InstructionalStrategy {
  name: String!
  description: String!
  steps: [String]
  applicableGrades: [Int]
  applicableStandards: [String]
  examples: [String]
}

type WalkthroughData {
  quarter: String
  schools: [SchoolObservation]
}

type SchoolObservation {
  schoolCode: String!
  rubricScores: AWSJSON
  notes: String
}
